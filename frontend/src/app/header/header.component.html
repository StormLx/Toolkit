<div class="header-container">
  <div class="app-name">
    <span>My App</span>
  </div>
  <div class="user-info" *ngIf="isAuthenticated$ | async as isAuth">
    <span class="icon">[ICON]</span>
    <span>Hello, {{ username$ | async }}</span>
    <button (click)="logout()">Logout</button>
  </div>
  <div class="user-info" *ngIf="!(isAuthenticated$ | async)"> <!-- Adjusted to use !(isAuthenticated$ | async) for clarity -->
     <button (click)="login()">Login</button>
  </div>
</div>
