services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080" # Spring Boot app
      - "5005:5005" # Debug port (optional)
    volumes:
      - ./backend/src:/app/src # Hot reload for backend source
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/appdb
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=appsecret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_LIQUIBASE_CHANGE_LOG=classpath:db/changelog/db.changelog-master.yaml
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080 # Keycloak internal URL (no /auth in v22)
      - KEYCLOAK_REALM=my-app-realm
      - KEYCLOAK_RESOURCE=my-backend-client
      # - KEYCLOAK_CREDENTIALS_SECRET=YOUR_BACKEND_CLIENT_SECRET # Set this if backend client is confidential
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/my-app-realm # External URL for Spring Security (no /auth in v22)
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=my-backend-client
      # - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=YOUR_BACKEND_CLIENT_SECRET
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started  # Changed to service_started since health check might not work in dev mode
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200" # Angular app
    volumes:
      - ./frontend/src:/app/src # Hot reload for frontend source
      - ./frontend/public:/app/public # For static assets if any in public
    environment:
      - KEYCLOAK_AUTH_SERVER_URL=http://localhost:8180 # External URL for frontend (no /auth in v22)
      - KEYCLOAK_REALM=my-app-realm
      - KEYCLOAK_FRONTEND_CLIENT_ID=my-frontend-client
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=appsecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql # Initialize schema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    ports:
      - "8180:8080" # Keycloak admin console and auth endpoints (external)
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL_HOST=db
      - KC_DB_URL_DATABASE=appdb
      - KC_DB_USERNAME=appuser
      - KC_DB_PASSWORD=appsecret
      - KC_DB_SCHEMA=keycloak
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_RELATIVE_PATH=/
      # KC_HTTP_RELATIVE_PATH is removed in v22, paths are now at root level
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import # Mount our realm config for potential import
    command: start-dev # Use 'start' for production
    depends_on:
      db:
        condition: service_healthy
    # Note: In dev mode, health endpoints might not be available on the same port
    # The documentation mentions health is available on management port, not the main port
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
